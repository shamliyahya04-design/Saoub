name: Saoub Phase 2 Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "browser-use @ git+https://github.com/browser-use/browser-use.git@eb4126921bea3373f91afc49fb4b59d6eda7fed6"
      - name: Validate runner
        run: python benchmarks/phase2/runner.py --validate-only
      - name: Run benchmark
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python benchmarks/phase2/runner.py
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase2-results-${{ github.run_id }}
          path: benchmarks/phase2/results/
