name: Saoub Phase 2 OpenHands Adapter Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  openhands-adapter-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

    steps:
      - name: Checkout Saoub
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Verify adapter and frozen candidate
        run: |
          set -euo pipefail

          test -f benchmarks/phase2/adapters/openhands.py

          grep -Fq 'FROZEN_COMMIT = "64c1269655012698bc66538967989996191beb6"'             benchmarks/phase2/adapters/openhands.py

          echo "ADAPTER_FROZEN_COMMIT=64c1269655012698bc66538967989996191beb6"
          echo "ADAPTER_SOURCE=VERIFIED"

      - name: Install frozen OpenHands
        run: |
          set -euo pipefail

          python3 -m venv .phase2-venv
          . .phase2-venv/bin/activate

          python -m pip install --upgrade pip

          python -m pip install \
            "git+https://github.com/All-Hands-AI/OpenHands.git@64c1269655012698bc66538967989996191beb6c"

      - name: Verify OpenHands runtime
        run: |
          set -euo pipefail

          . .phase2-venv/bin/activate

          command -v openhands
          openhands --help >/dev/null

          echo "OPENHANDS_RUNTIME=READY"

      - name: Verify Google credential availability
        run: |
          set -euo pipefail

          test -n "${GOOGLE_API_KEY:-}"

          echo "GOOGLE_API_KEY_PRESENT=YES"
          echo "GOOGLE_API_KEY_VALUE=REDACTED"

      - name: Validate adapter
        run: |
          set -euo pipefail

          . .phase2-venv/bin/activate

          PHASE2_PROVIDER_ID=google \
          PHASE2_MODEL_ID=gemini-2.5-flash \
          python benchmarks/phase2/adapters/openhands.py

      - name: Adapter contract smoke test
        run: |
          set -euo pipefail

          . .phase2-venv/bin/activate

          PHASE2_PROVIDER_ID=google \
          PHASE2_MODEL_ID=gemini-2.5-flash \
          python - <<'PY'
          from benchmarks.phase2.adapters.openhands import OpenHandsAdapter

          adapter = OpenHandsAdapter("/tmp/saoub-openhands-test")
          adapter.prepare()

          assert adapter.candidate_id == "openhands"
          assert adapter.candidate_commit == \
              "64c1269655012698bc66538967989996191beb6c"

          print("ADAPTER_PREPARE=PASS")
          print("FROZEN_REVISION=PASS")
          print("PROVIDER_CONFIG=PASS")
          print("EXECUTION_PATH=AVAILABLE")
          PY

      - name: Secret safety
        run: |
          set -euo pipefail

          ! git grep -nE \
            'AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}|gsk_[A-Za-z0-9_-]{20,}' \
            -- ':!*.lock'

          echo "SECRET_SCAN=PASS"
